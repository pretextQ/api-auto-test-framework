# 数据驱动测试用例
#
# 用例文件按模块(feature)/故事(story)组织,由 DataDriver.parametrize 在收集阶段
# 按模块过滤注入,一条测试方法可挂载任意多条数据。
#
# 链路说明: test_01_user 登录成功后通过 extract 段把 token/user_id 写入上下文,
# 订单模块通过 ${context.user_id} 引用,实现"登录 -> 创建订单 -> 查询订单"长链路传参。
#
# 校验通道:
#   expected.business_code  业务码断言(统一响应包 code 字段)
#   validation.jsonpath     响应JSONPath断言(value为null表示仅校验字段存在)
#   validation.database     MySQL落库断言(conditions支持${context.*}占位符)
#   extract                 响应字段提取,写入链路上下文

test_cases:
  - case_id: "TC001"
    name: "用户登录成功"
    feature: "用户模块"
    story: "用户登录"
    request:
      method: "POST"
      url: "/api/login"
      data:
        username: "testuser"
        password: "testpass"
    expected:
      status_code: 200
      business_code: 0
    validation:
      jsonpath:
        expr: "$.data.token"
        value: null
    extract:
      token: "$.data.token"
      user_id: "$.data.user_id"

  - case_id: "TC002"
    name: "用户登录失败-密码错误"
    feature: "用户模块"
    story: "用户登录"
    request:
      method: "POST"
      url: "/api/login"
      data:
        username: "testuser"
        password: "wrongpass"
    expected:
      status_code: 200
      business_code: 1001
    validation:
      jsonpath:
        expr: "$.message"
        value: "用户名或密码错误"

  - case_id: "TC003"
    name: "用户登录失败-账号禁用"
    feature: "用户模块"
    story: "用户登录"
    request:
      method: "POST"
      url: "/api/login"
      data:
        username: "lockeduser"
        password: "testpass"
    expected:
      status_code: 200
      business_code: 1002

  - case_id: "TC004"
    name: "创建订单"
    feature: "订单模块"
    story: "订单创建"
    request:
      method: "POST"
      url: "/api/orders"
      data:
        user_id: "${context.user_id}"
        product_id: 1002
        quantity: 2
    expected:
      status_code: 200
      business_code: 0
    validation:
      jsonpath:
        expr: "$.data.status"
        value: "created"
      database:
        table: "orders"
        conditions:
          order_id: "${context.order_id}"
        expected:
          status: "created"
          product_id: 1002
    extract:
      order_id: "$.data.order_id"

  - case_id: "TC005"
    name: "查询订单列表"
    feature: "订单模块"
    story: "订单查询"
    request:
      method: "GET"
      url: "/api/orders"
      params:
        user_id: "${context.user_id}"
    expected:
      status_code: 200
      business_code: 0
    validation:
      jsonpath:
        expr: "$.data.total"
        value: null

  - case_id: "TC006"
    name: "商品库存与落库校验"
    feature: "商品模块"
    story: "库存管理"
    request:
      method: "GET"
      url: "/api/products/1001"
    expected:
      status_code: 200
      business_code: 0
    validation:
      jsonpath:
        expr: "$.data.stock"
        value: 100
      database:
        table: "products"
        conditions:
          product_id: 1001
        expected:
          status: "on_sale"
