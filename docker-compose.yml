services:
  # 被测演示服务(FastAPI)
  demo-app:
    build:
      context: .
      dockerfile: demo_app/Dockerfile
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=test_user
      - DB_PASSWORD=test_password
      - DB_NAME=test_db
      - JWT_SECRET=${JWT_SECRET:-demo-only-secret-key-change-me-32-bytes}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [test-network]

  mysql:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=test_db
      - MYSQL_USER=test_user
      - MYSQL_PASSWORD=test_password
    ports:
      # 映射到宿主机3307,避免与本机已有MySQL(3306)冲突
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [test-network]

  # 自动化测试执行器
  test-runner:
    build: .
    volumes:
      - ./reports:/app/reports
      - ./logs:/app/logs
    environment:
      - TEST_ENV=test
      - API_BASE_URL=http://demo-app:8000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=test_user
      - DB_PASSWORD=test_password
      - DB_NAME=test_db
      - FEISHU_WEBHOOK=${FEISHU_WEBHOOK}
      - FEISHU_SECRET=${FEISHU_SECRET}
    depends_on:
      demo-app:
        condition: service_healthy
    networks: [test-network]

volumes:
  mysql_data:

networks:
  test-network:
    driver: bridge
