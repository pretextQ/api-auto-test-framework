version: '3.8'

services:
  test-runner:
    build: .
    volumes:
      - ./reports:/app/reports
      - ./logs:/app/logs
    environment:
      - TEST_ENV=${TEST_ENV:-test}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=test_user
      - DB_PASSWORD=test_password
      - DB_NAME=test_db
      - FEISHU_WEBHOOK=${FEISHU_WEBHOOK}
    depends_on:
      - mysql
    networks: [test-network]

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=test_db
      - MYSQL_USER=test_user
      - MYSQL_PASSWORD=test_password
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [test-network]

volumes:
  mysql_data:

networks:
  test-network:
    driver: bridge
