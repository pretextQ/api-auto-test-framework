name: 自动化测试

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

# Allure报告需推送到gh-pages分支,GITHUB_TOKEN需要写权限
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # 测试库:MySQL服务容器
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 安装依赖
        run: |
          pip install -U pip
          pip install -r requirements.txt -r demo_app/requirements.txt

      - name: 启动被测演示服务
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_NAME: test_db
        run: |
          nohup python -m uvicorn demo_app.main:app --host 127.0.0.1 --port 8000 > demo_app.log 2>&1 &
          sleep 2

      - name: 等待演示服务就绪
        run: |
          python - <<'PYEOF'
          import time
          import requests

          for _ in range(30):
              try:
                  if requests.get("http://127.0.0.1:8000/health", timeout=2).status_code == 200:
                      print("演示服务已就绪")
                      break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("演示服务启动失败")
          PYEOF

      - name: 运行测试(单元 + 冒烟)
        env:
          TEST_ENV: test
          API_BASE_URL: http://127.0.0.1:8000
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_NAME: test_db
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: >
          pytest -m "unit or smoke" --alluredir=reports/allure
          --cov=core --cov=data --cov=utils --cov-report=term-missing

      - name: 生成Allure报告
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: reports/allure

      - name: 部署报告到GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
